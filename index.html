<style>
:root{--ac:#0055aa;--y:#ffd84a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;overflow:hidden}
#app{position:fixed;inset:0;max-width:520px;margin:0 auto;overflow:hidden;background:#05070d}
#map,#svg,#mapw{position:absolute;inset:0;width:100%;height:100%;background:#05070d}
#mapw{z-index:1;transform:rotate(var(--rot,0deg));transition:transform .3s linear}#svg{z-index:2}
#win{position:absolute;inset:0;width:100%;height:100%;z-index:5;display:none}#win.on{display:block}
.scr{position:absolute;inset:0;display:none;flex-direction:column;z-index:10;pointer-events:none}

.top{padding:calc(18px + env(safe-area-inset-top)) 18px 0;pointer-events:auto}
.bot{padding:16px 18px calc(18px + env(safe-area-inset-bottom));pointer-events:auto}
.sp{flex:1}.g{background:#0b101aea;backdrop-filter:blur(18px);border-top:1px solid #ffffff1a;border-radius:26px 26px 0 0}
button{font:inherit;color:inherit;cursor:pointer}
.pill{display:block;width:100%;border:0;border-radius:999px;padding:16px;font-size:15px;font-weight:700;background:#fff;color:#000;margin-top:10px}
.pill.dark{background:#ffffff22;color:#fff}.pill:disabled{opacity:.4}
.badge{display:inline-block;font:700 11px ui-monospace,Menlo,monospace;color:var(--y);border:1.5px solid var(--y);border-radius:6px;padding:2px 6px;background:#000b;white-space:nowrap}
.pin{position:absolute;transform:translate(-50%,-50%) rotate(calc(-1*var(--rot,0deg)))}
h3{margin:0 0 12px;font-size:16px;text-align:center}
small,.dim{color:#9aa6bd;font-size:12px}
.h1{font-size:34px;font-weight:800;text-shadow:0 2px 14px #000}.gr{font-size:15px;color:#dfe8ff;text-shadow:0 1px 8px #000}
#q,#note{width:100%;padding:13px 14px;border-radius:14px;border:0;background:#ffffff1f;color:#fff;font-size:16px;margin-bottom:8px}
.row{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid #ffffff14}.row small{display:block;margin-top:2px}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:30;padding:10px 18px calc(18px + env(safe-area-inset-bottom));display:none;max-height:78%;overflow:auto}
.grab{width:40px;height:4px;border-radius:2px;background:#ffffff40;margin:0 auto 14px}
.cards,#chips,.styles{display:flex;gap:10px;overflow-x:auto;padding:4px 0}
.card{flex:0 0 auto;width:116px;padding:12px;border-radius:16px;background:#ffffff14;display:flex;flex-direction:column;gap:6px;border:1.5px solid transparent;align-items:flex-start}
.card.sel{border-color:var(--y)}.card b{font-size:15px}
#chips button,.styles button{flex:0 0 auto;border:0;border-radius:999px;padding:9px 14px;background:#ffffff1c;font-size:13px}
#chips button.sel,.styles button.sel{background:#fff;color:#000;font-weight:700}
.time{text-align:center;margin:10px 0 0;font-size:34px;font-weight:800}.time small{font-size:14px}
input[type=range]{width:100%;accent-color:var(--y)}
.menu{display:flex;gap:8px;margin-top:10px}.menu button{flex:1;border:0;border-radius:14px;padding:12px;background:#ffffff1c;font-size:14px}
.obw{flex:1;display:flex;flex-direction:column;padding:calc(24px + env(safe-area-inset-top)) 22px calc(24px + env(safe-area-inset-bottom))}
.dots{display:flex;gap:6px}.dots i{flex:1;height:3px;border-radius:2px;background:#ffffff30}.dots i.f{background:#fff}
.obt{flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px}.big{font-size:34px;font-weight:800;line-height:1.35;color:#8d9be0}
.big.glow{color:#fff;font-size:42px;text-shadow:0 0 18px #38d6ff,0 0 40px var(--ac)}
.bar{height:16px;margin:12px 0;--p:0%;background:linear-gradient(90deg,#fff var(--p),#ffffff40 var(--p));-webkit-mask:repeating-linear-gradient(90deg,#000 0 2px,transparent 2px 6px);mask:repeating-linear-gradient(90deg,#000 0 2px,transparent 2px 6px)}
.rt{display:flex;justify-content:space-between;align-items:center;font:700 20px ui-monospace,Menlo,monospace}
.fl{display:flex;justify-content:space-between;align-items:flex-end}.rem{text-align:right;font:700 30px ui-monospace,Menlo,monospace}
.ok{color:#5ef2a0;font-size:13px;font-weight:700}
.ticket{background:#fff;color:#111;border-radius:22px;padding:22px;margin:auto 0}.ticket small{color:#667}
.cd{display:flex;justify-content:space-between;align-items:center;margin:14px 0;font-size:30px;font-weight:800}.cd small{display:block;font-size:12px;font-weight:600}
.ticket dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0 0 14px;font-size:14px}.ticket dd{margin:0;text-align:right;font-weight:700}
.barcode{height:44px;background:repeating-linear-gradient(90deg,#111 0 2px,#fff 2px 4px,#111 4px 5px,#fff 5px 8px,#111 8px 9px,#fff 9px 12px);margin-bottom:12px}
.ticket #note{background:#eef0f5;color:#111;margin:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.stats div{background:#ffffff14;border-radius:14px;padding:12px}.stats b{display:block;font-size:20px;margin-top:4px}
.brow{display:flex;align-items:center;gap:10px;font-size:13px;margin:6px 0}.brow span{width:70px}.brow i{height:8px;background:var(--ac);border-radius:4px;min-width:2px}.brow em{font-style:normal;color:#9aa6bd}
.trn{width:16px;height:46px;margin:-23px 0 0 -8px;border-radius:9px 9px 4px 4px;border:2px solid #0055aa;background:repeating-linear-gradient(#fff 0 8px,#0055aa 8px 10px);box-shadow:0 0 14px #38d6ff}
.cb{width:44px;height:44px;border-radius:50%;border:0;background:#1a1f2ccc;backdrop-filter:blur(8px);font-size:18px;color:#fff}
.fr{display:flex;justify-content:space-between;align-items:flex-start}.col{display:flex;flex-direction:column;gap:10px}.pl{background:#1a1f2ccc;border-radius:26px;padding:6px;backdrop-filter:blur(8px)}.pl .cb{background:none}
.nx{margin-top:6px;padding:8px 16px;border-radius:999px;background:#0b101aea;font-size:13px;font-weight:700}
.fb{display:flex;justify-content:space-between;text-shadow:0 1px 10px #000}.rem{font-size:36px;font-weight:700}.rem small{font-size:15px;color:#e6eefc}
.sm{display:grid;grid-template-columns:1fr 1fr 28px 1fr 1fr;gap:8px;padding:16px 28px;overflow:auto}.sm i{display:block}
.st{height:46px;border-radius:12px;border:1.5px solid #ffffff30;background:#ffffff10;font-size:11px;color:#9aa6bd}.st.sel{background:var(--y);color:#000;border-color:var(--y);font-weight:700}.st:disabled{opacity:.25}
.gl{background:#1a1f2cee;border-radius:18px;padding:14px;margin-bottom:6px}
.ticket{background:#ffffff0f!important;color:#fff!important;border:1px solid #ffffff1a;margin:4px 0 14px!important}.ticket small{color:#9aa6bd!important}.ticket .cd{color:#fff}.ticket #note{background:#ffffff1f!important;color:#fff!important}
#attr{position:absolute;left:8px;bottom:2px;z-index:12;font-size:9px;color:#fffc;text-shadow:0 0 3px #000;pointer-events:none}
.gstage{position:relative;width:320px;height:360px;margin:18px auto 0;flex:none}
.gu{position:absolute;top:60px;width:96px;height:270px;border-radius:14px 14px 4px 4px;background:linear-gradient(#3b4150,#232731);border:1px solid #ffffff22}.gu.l{left:10px}.gu.r{right:10px}
.glamp{position:absolute;top:10px;left:50%;width:36px;height:8px;margin-left:-18px;border-radius:4px;background:#d33;box-shadow:0 0 10px #d33}.glamp.ok{background:#3df;box-shadow:0 0 14px #3df}
.gdisp{position:absolute;top:26px;left:8px;right:8px;height:34px;border-radius:6px;background:#06150f;color:#6f6;font-size:11px;display:flex;align-items:center;justify-content:center;text-align:center;padding:2px}
.gpad{position:absolute;top:72px;left:12px;right:12px;height:54px;border-radius:10px;background:#0a3a6a;transform:perspective(300px) rotateX(38deg);box-shadow:0 0 0 2px #fff3;display:flex;align-items:center;justify-content:center;transition:box-shadow .2s,background .2s}
.gpad.ok{background:#0a6aba;box-shadow:0 0 24px #3df,0 0 0 2px #fff6}
.gar{position:absolute;bottom:22px;left:50%;width:34px;height:34px;margin-left:-17px}.gar .okp{display:none}.gar.ok .okp{display:block}.gar.ok .xp{display:none}
.gf{position:absolute;top:214px;height:10px;width:54px;background:#ffd84a;border-radius:5px;transition:transform .5s}.gf.l{left:106px;transform-origin:left}.gf.r{right:106px;transform-origin:right}.gf.open{transform:scaleX(.08)}
.gc{position:absolute;left:95px;top:268px;width:130px;transition:transform .75s cubic-bezier(.3,.7,.3,1);cursor:pointer;filter:drop-shadow(0 8px 12px #000a)}
.gc.go{transform:translate(-102px,-150px) scale(.5) rotate(-8deg)}
@keyframes bob{50%{transform:translateY(-8px)}}.gc.idle{animation:bob 1.6s ease-in-out infinite}
#mapmsg{display:none;position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 64px);z-index:40;font-size:11px;line-height:1.5;background:#000d;border:1px solid #ffffff30;padding:8px 10px;border-radius:10px}
/* ===== glassmorphism ===== */
:root{--glass:rgba(255,255,255,.08);--gb:rgba(255,255,255,.2)}
.solid{background:radial-gradient(circle at 15% 8%,#0055aaaa,transparent 46%),radial-gradient(circle at 90% 28%,#38d6ff55,transparent 42%),radial-gradient(circle at 40% 105%,#7a4dff55,transparent 52%),#05070d!important}
.g,#sheet{background:rgba(14,20,34,.55)!important;backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);border:1px solid var(--gb);box-shadow:0 -8px 40px #0008,inset 0 1px 0 #ffffff33}
.t,.gl,.card,.nx,.pl,.cb,#chips button,.styles button,.stats div,.pill.dark,.st{background:var(--glass);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border:1px solid var(--gb);box-shadow:0 8px 28px #0006,inset 0 1px 0 #ffffff2e}
.ticket{background:var(--glass)!important;backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border:1px solid var(--gb)!important;box-shadow:0 8px 28px #0006,inset 0 1px 0 #ffffff2e}
.pl .cb{background:none;border:0;box-shadow:none;backdrop-filter:none}
#chips button.sel,.styles button.sel{background:rgba(255,255,255,.92);color:#000}
.st.sel{background:var(--y);color:#000;border-color:var(--y)}.st:disabled{opacity:.3}
.card.sel{border:1.5px solid var(--y)}
.pill:not(.dark){background:linear-gradient(135deg,#fff,#dbe7ff);box-shadow:0 6px 24px #38d6ff33}
/* ===== bento grid ===== */
.bento{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.t{border-radius:22px;padding:14px;color:#fff;text-align:left;min-width:0}
.w2{grid-column:span 2}.w3{grid-column:span 3}.w4{grid-column:span 4}.w6{grid-column:span 6}
.tv{font-size:28px;font-weight:800;margin-top:4px}.tv small{font-size:14px}
.tb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;cursor:pointer}
.t.cta{padding:8px}.t .pill,.bento>.pill{margin:0}.bento>.pill{border-radius:22px;grid-column:span 4}
.bar2{height:6px;border-radius:3px;background:#ffffff22;margin:10px 0 6px;overflow:hidden}.bar2 i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),#38d6ff)}
.t .cards{margin:4px -2px 0}.rem{font-size:30px}
.stats{grid-template-columns:repeat(6,1fr)!important}.stats div:nth-child(1){grid-column:span 2}.stats div:nth-child(2){grid-column:span 4}.stats div:nth-child(3){grid-column:span 4}.stats div:nth-child(4){grid-column:span 2}
.sx{position:absolute;top:10px;right:12px;width:34px;height:34px;border-radius:50%;border:1px solid var(--gb);background:#ffffff22;color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
#scrim{position:absolute;inset:0;z-index:29;display:none;background:#0006}
.fold{display:block;margin:0 auto 8px;width:56px;height:26px;border-radius:13px;border:1px solid var(--gb);background:#ffffff26;color:#fff;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:0}
.fold svg{transition:transform .2s}.scr.fold .fold svg{transform:rotate(180deg)}.scr.fold .bento{display:none}
#types{display:flex;gap:8px;align-items:center}#types button,#chips2 button{flex:0 0 auto;border:0;border-radius:999px;padding:9px 14px;background:#ffffff1c;color:#fff;font-size:13px}#types button.sel,#chips2 button.sel{background:#fff;color:#000;font-weight:700}
#chips2{display:flex;flex-wrap:wrap;gap:8px}
#th1,#th2,#tdest,#tf1,#acard,#hcode,#hname,#fmode,.cpk{cursor:pointer}
#mc{position:absolute;right:12px;top:40%;z-index:11;display:none;flex-direction:column;gap:8px}
#xfer{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 110px);z-index:35;display:none}
.xc{background:rgba(14,20,34,.7)}.xs{font-size:20px;font-weight:800;margin:4px 0}.xl{display:flex;justify-content:space-between;font-size:12px;font-weight:700}
.xw{position:relative;height:14px;border-radius:7px;margin:10px 0;background:linear-gradient(90deg,var(--xa,#0055aa),var(--xb,#e23a4a))}
.xw i{position:absolute;left:4%;top:-5px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 0 12px #fff;animation:walk 6s linear forwards}
@keyframes walk{from{left:2%}to{left:90%}}
.gslot{position:absolute;left:14px;right:14px;top:150px;height:8px;border-radius:4px;background:#000;box-shadow:inset 0 0 0 1px #ffffff22,0 0 0 2px #0006;display:block}
.gpad.read{box-shadow:0 0 0 3px #38d6ff,0 0 30px #38d6ff;background:#0a5aa8}
.gc.tap svg{animation:tapb .3s ease 2}@keyframes tapb{50%{transform:translateY(6px) scale(.97)}}
.gc.tkin{animation:none;transform:translate(-92px,-120px) scale(.45) rotate(90deg)}
.gc.tkhide{animation:none;transform:translate(-92px,-120px) scale(.45) rotate(90deg);opacity:0;transition:opacity .2s}
.gc.tkout{animation:none;transform:translate(92px,-120px) scale(.45) rotate(90deg);opacity:1;transition:none}
.gc.tkback{animation:none;transform:none;opacity:1;transition:transform .7s}
</style></head>

<script>
// ===== 路線・駅データベース: [駅名, 緯度, 経度] / 文字列は既出駅への参照 =====
const ST = {}, LN = {};
function line(id, name, color, arr){
  const names = arr.map(s => {
    if (typeof s === 'string') return s;
    ST[s[0]] ??= {n:s[0], lat:s[1], lng:s[2], lines:[]};
    return s[0];
  });
  names.forEach(n => { if(!ST[n].lines.includes(id)) ST[n].lines.push(id); });
  LN[id] = {name, color, st:names};
}
